name: run

on:
  workflow_dispatch:
  schedule:
    # backup start in case the self-restart chain ever breaks
    - cron: '*/30 * * * *'

# only one run at a time; a newer pending run replaces an older pending one
concurrency:
  group: afk-players
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # lets the last step start the next run

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Restore bot memory (friends / reputation)
        uses: actions/cache/restore@v4
        with:
          path: |
            memory.json
            traffic.json
          key: bot-memory-${{ github.run_id }}
          restore-keys: bot-memory-

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Run bot
        env:
          MAX_RUNTIME_MIN: '340'
          BOT_ADMIN_PIN: ${{ secrets.BOT_ADMIN_PIN }}
          BOT_PIN: ${{ secrets.BOT_PIN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
        run: node bedrock-bot.js

      - name: Save bot memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            memory.json
            traffic.json
          key: bot-memory-${{ github.run_id }}

      - name: Start next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
